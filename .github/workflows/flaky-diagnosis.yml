# Temporary: repeats the macOS suite to catch the intermittent failure. Removed before merge.
name: Flaky diagnosis

on:
  push:
    branches: [fix/macos-test-flake]

permissions:
  contents: read

jobs:
  repeat:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Suite run 1
        continue-on-error: true
        run: npm run test:ci
      - name: Suite run 2
        continue-on-error: true
        run: npm run test:ci
      - name: Suite run 3
        continue-on-error: true
        run: npm run test:ci
      - name: Suite run 4
        continue-on-error: true
        run: npm run test:ci
      - name: Lifecycle file, 40 runs
        continue-on-error: true
        run: |
          failed=0
          for i in $(seq 1 40); do
            node --test --test-reporter=dot --test-reporter-destination=stdout --test-reporter=./scripts/github-test-annotations.mjs --test-reporter-destination=stdout tests/qa-lifecycle.test.mjs || failed=$((failed + 1))
          done
          echo "::notice title=Lifecycle loop::$failed of 40 runs failed"
          test "$failed" -eq 0
